<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Bridge mark: engineering (square) ⟷ human-centered design (circle),
       connected by a live span. Canonical = active state. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10182c"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- span: soft glow underlay + bright arc + travelling spark -->
  <path d="M11.5 16 Q16 9 20.2 16" fill="none" stroke="#1d9e75" stroke-opacity="0.35" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M11.5 16 Q16 9 20.2 16" fill="none" stroke="#3fe0a6" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="16" cy="10.55" r="1.55" fill="#eafff6"/>

  <!-- engineering node (square) -->
  <rect x="4.9" y="12.7" width="6.6" height="6.6" rx="1.5" fill="#0a0f1e" stroke="#e8f0ee" stroke-width="1.7"/>
  <!-- human-centered design node (circle) -->
  <circle cx="23.8" cy="16" r="3.6" fill="#0a0f1e" stroke="#e8f0ee" stroke-width="1.7"/>
</svg>
