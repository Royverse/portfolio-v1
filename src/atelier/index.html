            <button id="camera-pip-toggle" class="camera-pip-toggle" aria-label="Toggle camera PIP view" title="Expand / collapse preview">⤢</button>
          </div>
        </div>

        <!-- Real-Time Camera Feedback Banner (Non-overlapping Bottom Center Pill) -->
        <div class="camera-status-feedback hidden" id="camera-status-feedback">Hold palm steady facing camera...</div>
      </div>

      <!-- Neumorphic Luxury HUD Overlay -->
      <main id="hud-overlay" role="main" aria-label="Roy's Atelier Instrument Controls"></main>
    </div>

  </body>
</html>
