  <body>
    <a href="#hud-overlay" class="skip-link">Skip to instrument controls</a>
    <div id="app">
      <!-- 3D Three.js WebGL Canvas -->
      <canvas id="webgl-canvas"></canvas>

      <!-- Minimal Floating Camera Viewport (Mobile PIP / Draggable / Collapsible) -->
      <div id="camera-dock" class="camera-dock studio-hud-chrome" title="Camera Tracking Feed" role="region" aria-label="Camera Tracking Viewport">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="skeleton-canvas" width="220" height="124"></canvas>
        <div class="camera-status">
          <span class="pulse-dot"></span>
          <span id="camera-label" class="camera-label">Tracking Idle</span>
        </div>

        <!-- Optical Zoom & Lighting Micro-Toolbar -->
        <div id="camera-optics-toolbar" class="camera-optics-toolbar" aria-label="Lens Optics & Exposure Controls">
          <div class="optics-zoom-group">
            <button id="btn-optics-zoom-out" class="optics-btn optics-btn-step" aria-label="Zoom camera lens out (Wider angle)" title="Zoom out / Wide angle (Key: [)">−</button>
            <button id="btn-optics-zoom-level" class="optics-btn optics-btn-value" aria-label="Current lens zoom level. Click to cycle presets" title="Lens Zoom. Click to cycle Wide / Std / Tele">0.85x</button>
            <button id="btn-optics-zoom-in" class="optics-btn optics-btn-step" aria-label="Zoom camera lens in" title="Zoom in (Key: ])">+</button>
          </div>
          <button id="btn-optics-auto" class="optics-btn optics-btn-toggle active" aria-pressed="true" aria-label="Toggle Auto-Optics hand distance framing" title="Auto-Optics: Adapts zoom to hand size & distance">AUTO</button>
          <button id="btn-optics-light" class="optics-btn optics-btn-toggle active" aria-pressed="true" aria-label="Toggle Auto-Brightness exposure compensation" title="Auto-Light: Low-light tracking boost">☀</button>
        </div>

        <button id="camera-pip-toggle" class="camera-pip-toggle" aria-label="Toggle camera PIP view" title="Expand / collapse preview">⤢</button>
      </div>

      <!-- Neumorphic Luxury HUD Overlay -->
      <main id="hud-overlay" role="main" aria-label="Roy's Atelier Instrument Controls"></main>
    </div>
