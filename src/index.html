    <script>
      (function() {
        // Universal Canvas roundRect Polyfill for legacy compatibility (devices pre-2022)
        if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
          CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            var radius = typeof r === 'number' ? r : (Array.isArray(r) ? r[0] : 0);
            if (w < 2 * radius) radius = w / 2;
            if (h < 2 * radius) radius = h / 2;
            this.beginPath();
            this.moveTo(x + radius, y);
            this.arcTo(x + w, y,     x + w, y + h, radius);
            this.arcTo(x + w, y + h, x,     y + h, radius);
            this.arcTo(x,     y + h, x,     y,     radius);
            this.arcTo(x,     y,     x + w, y,     radius);
            this.closePath();
            return this;
          };
        }
      })();

      /* Live "bridge" favicon — the span lights up green when this tab is
         active and dims to a dashed gap when it's in the background.
         Progressive enhancement: the static <link> above stays put for
         search crawlers, which don't run this script. */
      (function () {
        var fav = document.getElementById('rm-favicon');
        if (!fav) return;
        function bridgeSVG(on) {
          var struct = on ? '#e8f0ee' : '#9fb0bd';
          var base = on ? '#0a0f1e' : '#0c1322';
          var g0 = on ? '#10182c' : '#0f1727';
          var g1 = on ? '#0a0f1e' : '#0a1120';
          var span = on
            ? "<path d='M11.5 16 Q16 9 20.2 16' fill='none' stroke='#1d9e75' stroke-opacity='.35' stroke-width='4.6' stroke-linecap='round'/>"
              + "<path d='M11.5 16 Q16 9 20.2 16' fill='none' stroke='#3fe0a6' stroke-width='1.8' stroke-linecap='round'/>"
              + "<circle cx='16' cy='10.55' r='1.55' fill='#eafff6'/>"
            : "<path d='M11.5 16 Q16 12 20.2 16' fill='none' stroke='#8492a0' stroke-width='1.6' stroke-linecap='round' stroke-dasharray='1.5 2.3'/>";
          return "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>"
            + "<defs><linearGradient id='t' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='" + g0 + "'/><stop offset='1' stop-color='" + g1 + "'/></linearGradient></defs>"
            + "<rect width='32' height='32' rx='7' fill='url(#t)'/>"
            + "<rect x='.5' y='.5' width='31' height='31' rx='6.5' fill='none' stroke='#fff' stroke-opacity='.08'/>"
            + span
            + "<rect x='4.9' y='12.7' width='6.6' height='6.6' rx='1.5' fill='" + base + "' stroke='" + struct + "' stroke-width='1.7'/>"
            + "<circle cx='23.8' cy='16' r='3.6' fill='" + base + "' stroke='" + struct + "' stroke-width='1.7'/>"
            + "</svg>";
        }
        function paint() { fav.href = 'data:image/svg+xml,' + encodeURIComponent(bridgeSVG(!document.hidden)); }
        paint();
        document.addEventListener('visibilitychange', paint);
        window.addEventListener('focus', paint);
        window.addEventListener('blur', paint);
      })();
    </script>
